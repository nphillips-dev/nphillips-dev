<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">BUILD SYSTEMS. ENABLE PEOPLE. SHAPE WHAT’S NEXT.</title>
  <desc id="description">Three bold statements on a deep navy background. Connected markers highlight systems, people and the future in sequence. All text remains visible without animation.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0B1423" />
      <stop offset="1" stop-color="#152A3A" />
    </linearGradient>
    <style>
      .stage { opacity: .2; animation: focus 12s ease-in-out infinite; }
      .people { animation-delay: 4s; }
      .next { animation-delay: 8s; }
      @keyframes focus {
        0%, 30%, 100% { opacity: .2; }
        8%, 22% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .stage { animation: none; opacity: .7; }
      }
    </style>
  </defs>
  <rect width="1200" height="400" rx="16" fill="url(#background)" />
  <path d="M930 0V400M1050 0V400M0 100H1200M0 300H1200" stroke="#DDEBF3" stroke-opacity=".035" fill="none" />
  <rect x="54" y="49" width="30" height="3" rx="1.5" fill="#80E2CC" />
  <text x="98" y="56" fill="#AFBECC" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">TECHNOLOGY / PEOPLE / DIRECTION</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5">
    <text x="52" y="143" fill="#F3F6FA">BUILD SYSTEMS.</text>
    <text x="52" y="213" fill="#F3F6FA">ENABLE PEOPLE.</text>
    <text x="52" y="283" fill="#80E2CC">SHAPE WHAT’S NEXT.</text>
  </g>
  <path d="M1010 126V266" stroke="#80E2CC" stroke-opacity=".25" stroke-width="2" />
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.5" fill="#AFBECC">
    <text x="1036" y="130">SYSTEMS</text>
    <text x="1036" y="200">PEOPLE</text>
    <text x="1036" y="270">WHAT’S NEXT</text>
  </g>
  <g fill="#152A3A" stroke="#80E2CC" stroke-width="1.5">
    <circle cx="1010" cy="126" r="5" />
    <circle cx="1010" cy="196" r="5" />
    <circle cx="1010" cy="266" r="5" />
  </g>
  <g fill="#A3F5E1">
    <g class="stage systems"><circle cx="1010" cy="126" r="5" /><rect x="54" y="154" width="55" height="2" rx="1" /></g>
    <g class="stage people"><circle cx="1010" cy="196" r="5" /><rect x="54" y="224" width="55" height="2" rx="1" /></g>
    <g class="stage next"><circle cx="1010" cy="266" r="5" /><rect x="54" y="294" width="55" height="2" rx="1" /></g>
  </g>
  <text x="54" y="347" fill="#AFBECC" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">ENGINEERING ROOTS. LEADERSHIP FOCUS.</text>
</svg>


